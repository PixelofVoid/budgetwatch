[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetwatch"
version = "1.0.0"
description = "Local household cash-flow tracker for Omarchy Linux"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
budgetwatch = "budgetwatch.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
